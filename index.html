<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuildMatch - Find Trusted Contractors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER: the top bar of the site -->
  <header>
    <h1>BuildMatch</h1>
    <p>Connecting homeowners with trusted contractors</p>
  </header>

  <!-- MAIN: the main content of the page -->
  <main>

    <section class="hero">
      <h2>Get a Fair Estimate. Find a Trusted Contractor.</h2>
      <p>Free to join. Pay only if you win the job. No shared leads.</p>
      <a href="#signup" class="button">Get Started</a>
    </section>

    <section id="signup" class="signup">
      <h2>Sign Up</h2>
      <p>Are you a homeowner or a contractor?</p>
      <button id="homeowner-btn">I'm a Homeowner</button>
      <button id="contractor-btn">I'm a Contractor</button>

      <!-- This message stays hidden until JavaScript shows it -->
      <p id="response-message"></p>
    </section>

  </main>

  <!-- FOOTER: the bottom of the page -->
  <footer>
    <p>&copy; 2026 BuildMatch. All rights reserved.</p>
  </footer>

  <!-- Link to our JavaScript file, placed at the bottom so the page loads first -->
  <script src="script.js"></script>

</body>
</html>
